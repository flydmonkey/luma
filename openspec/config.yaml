schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Product: Luma — local-first Windows screen recorder (no account).
  This repo (luma-windows) is a greenfield rewrite of C:\Users\Administrator\Projects\record.
  Replicate that product's WinUI 3 desktop UI and user-facing features.
  Do NOT reimplement Media Foundation SinkWriter, GpuSurfaceWriter, custom NV12, or DXGI-to-encoder GPU slot ownership.
  Realtime capture + hardware encode + mux MUST go through open-source libobs (OBS Studio core) and its plugins (NVENC/AMF/QSV/x264, monitor/window/game/WASAPI sources).
  Post-processing (trim/merge/compress/repair/subtitles/music) may still use bundled FFmpeg.
  Tech stack: C# / .NET 8 / WinUI 3 / Windows App SDK 1.6 / x64 / Windows 10 1809+.
  libobs is GPL-2.0; this project must remain license-compatible when linking libobs.
  Reference product specs live in the record repo under openspec/specs/.
  Planning artifacts and UI-facing copy may be written in 简体中文.
  Do not start implementation during propose; artifacts only.

